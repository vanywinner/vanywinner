<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vanywinner News: Kenya, Africa and the world</title>
<meta name="description" content="Breaking news, business, sport, opinion and video from Kenya and beyond.">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="breaking-bar" class="breaking-bar">
  <span class="breaking-bar__label">Breaking</span>
  <p id="breaking-text" class="breaking-bar__text"></p>
  <time id="today-date" class="breaking-bar__date"></time>
</div>

<header id="site-header" class="site-header">
  <a class="brand" href="index.html" aria-label="Vanywinner home">
    <img class="brand__logo" src="favicon.svg" alt="" width="40" height="40">
    <span class="brand__name">Vanywinner<small>News</small></span>
  </a>
  <nav id="main-nav" class="main-nav" aria-label="Main">
    <a class="main-nav__link is-active" href="#top-stories">Home</a>
    <a class="main-nav__link" href="#news">News</a>
    <a class="main-nav__link" href="#business">Business</a>
    <a class="main-nav__link" href="#sports">Sports</a>
    <a class="main-nav__link" href="#opinion">Opinion</a>
    <a class="main-nav__link" href="#videos">Videos</a>
    <a class="main-nav__link" href="#videos">Live TV</a>
  </nav>
  <button id="search-toggle" class="icon-btn" type="button" aria-label="Search stories">Search</button>
  <button id="menu-toggle" class="icon-btn icon-btn--menu" type="button" aria-label="Open menu" aria-expanded="false">Menu</button>
</header>

<form id="search-panel" class="search-panel" role="search" hidden>
  <input id="search-input" class="search-panel__input" type="search" placeholder="Search headlines and summaries" aria-label="Search stories">
</form>

<main id="main-content" class="page">
  <section id="top-stories" class="top-stories">
    <article id="lead-story" class="lead-story"></article>
    <div id="side-stories" class="side-stories"></div>
    <aside class="trending" aria-labelledby="trending-title">
      <h2 id="trending-title" class="trending__title">Most read</h2>
      <ol id="trending-list" class="trending__list"></ol>
    </aside>
  </section>

  <section id="videos" class="videos">
    <h2 class="section-title">Watch</h2>
    <div id="video-grid" class="video-grid"></div>
  </section>

  <div id="category-sections"></div>
</main>

<div id="video-modal" class="modal" hidden>
  <div class="modal__box">
    <button id="video-close" class="modal__close" type="button" aria-label="Close video">Close</button>
    <div id="video-player" class="modal__player"></div>
  </div>
</div>

<footer id="site-footer" class="site-footer">
  <p class="site-footer__brand">Vanywinner News</p>
  <p class="site-footer__note">Nairobi, Kenya. &copy; <span id="footer-year"></span> vanywinner.co.ke</p>
</footer>

<script src="js/data.js"></script>
<script src="js/main.js"></script>
</body>
</html>
