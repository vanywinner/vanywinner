name: Build static pages
on:
  push:
    paths: ["data/posts.json", "scripts/build.js"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/build.js
      - name: Commit generated files
        run: |
          git config user.name "vanywinner-bot"
          git config user.email "bot@vanywinner.co.ke"
          git add -A
          if ! git diff --cached --quiet; then git commit -m "Build static pages" && git push; fi
